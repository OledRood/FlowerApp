publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  date_time_picker: ^2.1.0
  image_picker: ^1.1.2
  fluttertoast: ^8.2.10
  sqflite: ^2.4.1
  path: ^1.8.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  table_calendar: ^3.0.8
  flutter_widgetkit: ^1.0.3
  flutter_local_notifications: ^9.3.1
  timezone: ^0.8.0
  flutter_riverpod: ^2.6.1

  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/images/notFound.jpg

